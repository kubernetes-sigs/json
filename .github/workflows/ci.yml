name: ci-pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '', '1.x' ] # '' uses go.mod, 1.x uses latest go
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      with:
        path: src/sigs.k8s.io/json/

    - name: Set up Go
      uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
      with:
        go-version-file: 'src/sigs.k8s.io/json/go.mod'
        go-version: ${{ matrix.go }}
        check-latest: true

    - name: Test
      run: |
        cd ${GITHUB_WORKSPACE}/src/sigs.k8s.io/json/
        make test
    - name: Benchmark
      run: |
        cd ${GITHUB_WORKSPACE}/src/sigs.k8s.io/json/
        make benchmark
    - name: Vet
      run: |
        cd ${GITHUB_WORKSPACE}/src/sigs.k8s.io/json/
        make vet
    - name: fmt
      run: |
        cd ${GITHUB_WORKSPACE}/src/sigs.k8s.io/json/
        make fmt
        git diff --exit-code

  apidiff:
    runs-on: ubuntu-latest
    if: github.base_ref
    steps:
      - name: Checkout old code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          ref: ${{ github.base_ref }}
          path: "old"
      - name: Checkout new code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          path: "new"
      - name: Install Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version-file: 'new/go.mod'
      - name: Add GOBIN to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: go install golang.org/x/exp/cmd/apidiff@latest
      - name: APIDiff
        run: ./hack/verify-apidiff.sh -d ../old
        working-directory: "new"


